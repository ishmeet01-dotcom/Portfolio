services:
  - type: web
    name: ishmeet-singh-portfolio
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: redirect
        source: /coa
        destination: /coa/
      - type: redirect
        source: /about
        destination: /about/
      - type: redirect
        source: /projects
        destination: /projects/
      - type: redirect
        source: /skills
        destination: /skills/
      - type: redirect
        source: /education
        destination: /education/
      - type: redirect
        source: /achievements
        destination: /achievements/
      - type: redirect
        source: /resume
        destination: /resume/
      - type: redirect
        source: /contact
        destination: /contact/
      - type: rewrite
        source: /*
        destination: /index.html
